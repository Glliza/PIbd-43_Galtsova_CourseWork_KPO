name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
      - name: Run Checkstyle (Linter)
        run: cd backend && ./gradlew checkstyleMain
      
      - name: Run Tests and Generate JaCoCo Report
        run: cd backend && ./gradlew test jacocoTestReport
      
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: backend/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: .github/badges
          generate-branches-badge: true  
      - name: Commit and Push Badge
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/badges/jacoco.svg
            git commit -m "ci: update jacoco coverage badge"
            git push
          fi

  frontend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run ESLint
        run: cd frontend && npx eslint src
      - name: Check Prettier formatting
        run: cd frontend && npx prettier --check src
      - name: Run Tests
        run: cd frontend && npm test -- --watchAll=false || echo "No tests yet"

  build:
    needs: [backend-lint-and-test, frontend-lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Backend Artifact
        run: cd backend && chmod +x gradlew && ./gradlew build -x test
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  metrics:
    name: Calculate CI Stability Metric
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-lint-and-test, build]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Calculate Pipeline Success Rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNS_DATA=$(gh api repos/${{ github.repository }}/actions/workflows/ci.yml/runs?per_page=20)

          TOTAL_RUNS=$(echo "$RUNS_DATA" | jq '.workflow_runs | length')
          SUCCESS_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          FAILED_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion == "failure")] | length')
          OTHER_RUNS=$(echo "$RUNS_DATA" | jq '[.workflow_runs[] | select(.conclusion != "success" and .conclusion != "failure")] | length')

          if [ "$TOTAL_RUNS" -gt 0 ]; then
            SUCCESS_RATE=$(awk "BEGIN {printf \"%.2f\", ($SUCCESS_RUNS / $TOTAL_RUNS) * 100}")
          else
            SUCCESS_RATE="0.00"
          fi

          echo "###  Автоматический сбор метрик CI" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: \`ci.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Всего последних запусков**: $TOTAL_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Успешных**: $SUCCESS_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Упавших с ошибкой**: $FAILED_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Отмененных/Пропущенных**: $OTHER_RUNS" >> $GITHUB_STEP_SUMMARY
          echo "- **Доля успешных запусков (Stability)**: **${SUCCESS_RATE}%**" >> $GITHUB_STEP_SUMMARY

          # Сохраняем данные в файл-артефакт
          echo "metric_name=ci_stability_rate" > ci-metrics.txt
          echo "workflow=ci.yml" >> ci-metrics.txt
          echo "success_rate_percent=${SUCCESS_RATE}" >> ci-metrics.txt
          echo "total_runs=${TOTAL_RUNS}" >> ci-metrics.txt
          echo "success_runs=${SUCCESS_RUNS}" >> ci-metrics.txt
          echo "failed_runs=${FAILED_RUNS}" >> ci-metrics.txt
          echo "other_runs=${OTHER_RUNS}" >> ci-metrics.txt

      - name: Upload CI Metrics Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-stability-metrics-report
          path: ci-metrics.txt