name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Проверка бэкенда (Java)
  backend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew
      - name: Run Checkstyle (Linter)
        run: cd backend && ./gradlew checkstyleMain
      - name: Run Tests
        run: cd backend && ./gradlew test
      - name: Generate JaCoCo Report
        run: cd backend && ./gradlew jacocoTestReport
      - name: Debug - List Reports Directory
        run: ls -la backend/build/reports/jacoco/test/html/ || echo "Папка не найдена!"
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/
      - name: Check JaCoCo Report
        run: |
          if [ -d "backend/build/reports/jacoco/test/html" ]; then
            echo "Папка с отчетом найдена"
            ls -la backend/build/reports/jacoco/test/html/
          else
            echo "ОШИБКА: Папка с отчетом НЕ найдена"
            exit 1
          fi
      
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

  # 2. Проверка фронтенда (React)
  frontend-lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run ESLint
        run: cd frontend && npx eslint src
      - name: Check Prettier formatting
        run: cd frontend && npx prettier --check src
      - name: Run Tests (если они есть)
        run: cd frontend && npm test -- --watchAll=false || echo "No tests yet"

  # 3. Сборка проекта
  build:
    needs: [backend-lint-and-test, frontend-lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Backend Artifact
        run: cd backend && chmod +x gradlew && ./gradlew build -x test
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar